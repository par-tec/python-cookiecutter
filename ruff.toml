# ===================================================================================
# HEY! Are you using `ruff` for the first time in a hundreds years old project?
# USE `ruff --add-noqa` to automatically add `noqa` directives where they are needed!
# See: https://docs.astral.sh/ruff/linter/#inserting-necessary-suppression-comments
# ===================================================================================

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

show-fixes = true

[lint]
select = ["ALL"]

ignore = [
    # Some rules are ignored to not conflict with formatter.
    #   See: https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191", "E111", "E114","E117", "D206","D300", "Q000", "Q001", "Q002",
    "Q003", "COM812", "COM819",
    "D203", # conflicts with "D211"
    "D213", # conflicts with "D212"
]

[lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402"]
"**/tests/*" = ["S101"]

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
